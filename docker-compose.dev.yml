services:
  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/build/app
    ports:
      - "8000:8000"
    environment:
      FALCONTROL_DEBUG: "true"
      FALCONTROL_LOG_LEVEL: "DEBUG"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    volumes:
      - ./backend/app:/build/app
    environment:
      FALCONTROL_DEBUG: "true"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development

  nginx:
    volumes:
      - ./deploy/nginx/nginx.dev.conf:/etc/nginx/conf.d/falcontrol.conf:ro
