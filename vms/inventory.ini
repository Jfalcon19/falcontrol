# inventory.ini — Entorno de pruebas de Falcontrol
#
# Rellena las IPs reales de tus máquinas antes de usar Ansible.
# NUNCA commitees este archivo con credenciales reales.
# Usa ansible-vault para contraseñas sensibles.

[linux_targets]
# Sustituye 192.168.x.x con la IP de tu VM Linux (Ubuntu/Debian)
# ansible_user: ubuntu (Ubuntu) o admin (Debian cloud-init)
linux-target ansible_host=192.168.x.x ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

[win11]
# Sustituye 192.168.x.x con la IP de tu VM Windows 11 (TinyWin + WinRM)
win11 ansible_host=192.168.x.x ansible_user=Administrator ansible_password=CHANGEME ansible_connection=winrm ansible_winrm_transport=ntlm ansible_winrm_server_cert_validation=ignore ansible_port=5985

[all:vars]
ansible_python_interpreter=/usr/bin/python3

# ─── Verificar conectividad ───────────────────────────────────────────────────
# Linux:   ansible -i vms/inventory.ini linux_targets -m ping
# Windows: ansible -i vms/inventory.ini win11 -m win_ping
