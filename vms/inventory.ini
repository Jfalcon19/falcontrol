[controller]
falcontrol-controller ansible_host=CONTROLLER_IP ansible_user=admin ansible_ssh_private_key_file=~/.ssh/falcontrol_ed25519

[linux_targets]
falcontrol-linux ansible_host=LINUX_TARGET_IP ansible_user=admin ansible_ssh_private_key_file=~/.ssh/falcontrol_ed25519

[win11]
win11 ansible_host=WIN11_IP ansible_user=Administrator ansible_password=CHANGEME ansible_connection=winrm ansible_winrm_transport=ntlm ansible_winrm_server_cert_validation=ignore ansible_port=5985

[all:vars]
ansible_python_interpreter=/usr/bin/python3

# ─── Instrucciones ────────────────────────────────────────────────────────────
# 1. Sustituye CONTROLLER_IP, LINUX_TARGET_IP y WIN11_IP con las IPs reales.
#    Puedes obtenerlas con: virsh net-dhcp-leases default
# 2. Para win11, ajusta ansible_user y ansible_password.
# 3. NUNCA commitees este archivo con credenciales reales.
#    Añade un .env.vms o usa ansible-vault para las passwords de producción.
