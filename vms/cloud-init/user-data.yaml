#cloud-config

hostname: FALCONTROL_VM_HOSTNAME
fqdn: FALCONTROL_VM_HOSTNAME.local
manage_etc_hosts: true

users:
  - name: admin
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - FALCONTROL_SSH_PUBKEY

write_files:
  - path: /etc/default/grub.d/99-serial-console.cfg
    permissions: '0644'
    content: |
      GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX console=ttyS0,115200n8"
      GRUB_SERIAL_COMMAND="serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1"
      GRUB_TERMINAL_INPUT="serial console"
      GRUB_TERMINAL_OUTPUT="serial console"

runcmd:
  - update-grub
  - systemctl enable --now qemu-guest-agent
  - echo "Cloud-init finished: $(hostname)" > /tmp/cloud-init-done

final_message: "Falcontrol VM ready after $UPTIME seconds."
