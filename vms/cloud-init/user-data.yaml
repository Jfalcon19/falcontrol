#cloud-config
# Plantilla cloud-init para VMs Debian 13 del entorno de desarrollo Falcontrol.
# Sustituir FALCONTROL_SSH_PUBKEY con el contenido de ~/.ssh/falcontrol_ed25519.pub

hostname: FALCONTROL_VM_HOSTNAME
fqdn: FALCONTROL_VM_HOSTNAME.local
manage_etc_hosts: true

users:
  - name: admin
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - FALCONTROL_SSH_PUBKEY

package_update: true
package_upgrade: false
packages:
  - qemu-guest-agent
  - python3
  - python3-pip
  - curl
  - git
  - vim

runcmd:
  - systemctl enable --now qemu-guest-agent
  - echo "Cloud-init finished: $(hostname)" > /tmp/cloud-init-done

final_message: "Falcontrol VM ready after $UPTIME seconds."
